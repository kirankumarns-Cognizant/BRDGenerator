# BRD Pipeline Configuration
# All paths, thresholds, and tool settings

# Multi-Provider LLM Fallback Chain Configuration
# Priority: Claude API → OpenAI → Gemini → GitHub Copilot → Claude Code → Static Analysis
# Each provider checked for API key availability - first available is used
# VS Code extensions (GitHub Copilot, Claude Code) require NO API KEY
multi_provider_llm:
  enabled: true                              # Enable multi-provider fallback
  auto_fallback: true                        # Automatically fallback to next provider if current fails
  fallback_priority:                         # Priority order for provider selection
    - "anthropic"                            # Claude API (requires ANTHROPIC_API_KEY)
    - "openai"                               # GPT-4/GPT-3.5 (requires OPENAI_API_KEY)
    - "gemini"                               # Google Gemini (requires GOOGLE_API_KEY)
    - "github_copilot"                       # GitHub Copilot Chat (NO API KEY - requires gh auth)
    - "claude_code"                          # Claude Code VS Code Extension (NO API KEY)
    - "static"                               # Static analysis fallback (always available)
  
  # Provider-specific settings
  providers:
    anthropic:
      name: "Claude API"
      api_key_env: "ANTHROPIC_API_KEY"
      supports_no_key: false                 # Requires API key
    openai:
      name: "OpenAI (GPT)"
      api_key_env: "OPENAI_API_KEY"
      supports_no_key: false                 # Requires API key
    gemini:
      name: "Google Gemini"
      api_key_env: "GOOGLE_API_KEY"
      supports_no_key: false                 # Requires API key
    github_copilot:
      name: "GitHub Copilot Chat"
      api_key_env: null                      # No API key needed
      supports_no_key: true                  # Works with gh CLI auth only
      cli_command: "gh auth status"          # Check availability
    claude_code:
      name: "Claude Code (VS Code)"
      api_key_env: null                      # No API key needed
      supports_no_key: true                  # Works via VS Code extension
      cli_command: "code --list-extensions"  # Check availability

# Directory paths
paths:
  repo_root: "test_repo"                    # Target repository to analyze
  output_dir: "output"                       # Agent outputs (transient)
  kb_dir: "KB"                               # JSON artifacts by repo (persistent)
  kb_store_dir: "kb_store"                   # Vector/RAG store (Agent 9)
  hitl_pending_dir: "HITL_PENDING"           # Human-in-the-loop review queue

# Confidence thresholds
thresholds:
  low_confidence: 0.6                        # Trigger HITL below this
  minimum_artifact_confidence: 0.7           # Discard below this

# Language Support Configuration
supported_languages:
  java:
    name: "Java"
    source_extensions: ['.java']
    config_extensions: ['.xml', '.properties', '.gradle']
    framework_indicators:
      - 'pom.xml'
      - 'build.gradle'
      - 'settings.gradle'
    test_patterns: ['**/test/**', '**/*Test.java', '**/*Tests.java']
    
  typescript:
    name: "TypeScript/JavaScript"
    source_extensions: ['.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs']
    config_extensions: ['.json', '.yaml', '.yml']
    framework_indicators:
      - 'package.json'
      - 'tsconfig.json'
      - 'webpack.config.js'
      - 'vite.config.ts'
      - 'next.config.js'
    test_patterns: ['**/__tests__/**', '**/*.test.*', '**/*.spec.*']
    
  python:
    name: "Python"
    source_extensions: ['.py']
    config_extensions: ['.yaml', '.yml', '.toml', '.ini', '.cfg']
    framework_indicators:
      - 'requirements.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'Pipfile'
      - 'poetry.lock'
    test_patterns: ['**/tests/**', '**/test_*.py', '**/*_test.py']
    
  dotnet:
    name: ".NET (C#/F#)"
    source_extensions: ['.cs', '.fs', '.vb']
    config_extensions: ['.config', '.json', '.xml']
    framework_indicators:
      - '*.csproj'
      - '*.fsproj'
      - '*.sln'
      - 'appsettings.json'
    test_patterns: ['**/Tests/**', '**/*.Tests.*', '**/*Test.cs']
    
  go:
    name: "Go"
    source_extensions: ['.go']
    config_extensions: ['.yaml', '.yml', '.toml', '.json']
    framework_indicators:
      - 'go.mod'
      - 'go.sum'
    test_patterns: ['**/*_test.go']
    
  rust:
    name: "Rust"
    source_extensions: ['.rs']
    config_extensions: ['.toml']
    framework_indicators:
      - 'Cargo.toml'
      - 'Cargo.lock'
    test_patterns: ['**/tests/**', '**/*_test.rs']

# Adapter Retry Configuration
adapter_retry:
  max_attempts: 3
  backoff_multiplier: 2
  initial_delay_seconds: 1
  max_delay_seconds: 30
  retryable_errors:
    - 'ConnectionError'
    - 'Timeout'
    - 'RateLimitError'
    - 'HTTPError'

# LLM Configuration - Multi-Provider Smart Model Selection by Task Complexity
llm:
  # Global provider settings (can override per-agent)
  default_provider: "anthropic"              # or "openai"
  timeout_seconds: 60
  retry_attempts: 3
  
  # Provider API Key Environment Variables
  providers:
    anthropic:
      api_key_env: "ANTHROPIC_API_KEY"
      available_models:
        # Claude 3 Family
        - id: "claude-3-opus"
          display: "Claude 3 Opus (Most Capable)"
          input_cost_per_mtok: 0.015          # $15 per million input tokens
          output_cost_per_mtok: 0.075         # $75 per million output tokens
          max_tokens: 200000
          best_for: "Complex reasoning, synthesis, document writing"
          
        - id: "claude-3-sonnet"
          display: "Claude 3 Sonnet (Balanced)"
          input_cost_per_mtok: 0.003          # $3 per million input tokens
          output_cost_per_mtok: 0.015         # $15 per million output tokens
          max_tokens: 200000
          best_for: "Medium complexity, strategic analysis"
          
        - id: "claude-3-haiku"
          display: "Claude 3 Haiku (Fast & Cheap)"
          input_cost_per_mtok: 0.00025        # $0.25 per million input tokens
          output_cost_per_mtok: 0.00125       # $1.25 per million output tokens
          max_tokens: 200000
          best_for: "Simple pattern matching, templates"
        
        # Claude 3.5 Family
        - id: "claude-3.5-sonnet"
          display: "Claude 3.5 Sonnet (Enhanced Balanced)"
          input_cost_per_mtok: 0.003          # $3 per million input tokens
          output_cost_per_mtok: 0.015         # $15 per million output tokens
          max_tokens: 200000
          best_for: "Medium complexity, latest model"
          
        - id: "claude-3.5-haiku"
          display: "Claude 3.5 Haiku (Enhanced Fast)"
          input_cost_per_mtok: 0.00080        # $0.80 per million input tokens
          output_cost_per_mtok: 0.0040        # $4 per million output tokens
          max_tokens: 200000
          best_for: "Fast processing with enhanced capabilities"
        
        # Claude 4 Family (if available)
        - id: "claude-4-opus"
          display: "Claude 4 Opus (Most Advanced)"
          input_cost_per_mtok: 0.025          # $25 per million input tokens
          output_cost_per_mtok: 0.100         # $100 per million output tokens
          max_tokens: 200000
          best_for: "Most complex reasoning, next-generation capabilities"
          
        - id: "claude-4-sonnet"
          display: "Claude 4 Sonnet (Advanced Balanced)"
          input_cost_per_mtok: 0.006          # $6 per million input tokens
          output_cost_per_mtok: 0.024         # $24 per million output tokens
          max_tokens: 200000
          best_for: "Advanced reasoning with balance"
          
        # Claude 5 Family (if available)
        - id: "claude-5-opus"
          display: "Claude 5 Opus (Latest Generation)"
          input_cost_per_mtok: 0.030          # $30 per million input tokens
          output_cost_per_mtok: 0.120         # $120 per million output tokens
          max_tokens: 200000
          best_for: "Latest generation for cutting-edge reasoning"
          
        - id: "claude-5-sonnet"
          display: "Claude 5 Sonnet (Latest Balanced)"
          input_cost_per_mtok: 0.008          # $8 per million input tokens
          output_cost_per_mtok: 0.032         # $32 per million output tokens
          max_tokens: 200000
          best_for: "Latest generation balanced model"
          
        - id: "claude-5-haiku"
          display: "Claude 5 Haiku (Latest Fast)"
          input_cost_per_mtok: 0.0012         # $1.20 per million input tokens
          output_cost_per_mtok: 0.0060        # $6 per million output tokens
          max_tokens: 200000
          best_for: "Latest generation fast processing"
    
    openai:
      api_key_env: "OPENAI_API_KEY"
      available_models:
        - id: "gpt-4-turbo"
          display: "GPT-4 Turbo (Latest)"
          input_cost_per_mtok: 0.01           # $10 per million input tokens
          output_cost_per_mtok: 0.03          # $30 per million output tokens
          max_tokens: 128000
          best_for: "Complex reasoning, alternative to opus"
          
        - id: "gpt-4-turbo-preview"
          display: "GPT-4 Turbo Preview"
          input_cost_per_mtok: 0.01           # $10 per million input tokens
          output_cost_per_mtok: 0.03          # $30 per million output tokens
          max_tokens: 128000
          best_for: "Advanced preview features"
          
        - id: "gpt-4"
          display: "GPT-4 (Original)"
          input_cost_per_mtok: 0.03           # $30 per million input tokens
          output_cost_per_mtok: 0.06          # $60 per million output tokens
          max_tokens: 8192
          best_for: "High-quality reasoning"
          
        - id: "gpt-4o"
          display: "GPT-4o (Optimized)"
          input_cost_per_mtok: 0.005          # $5 per million input tokens
          output_cost_per_mtok: 0.015         # $15 per million output tokens
          max_tokens: 128000
          best_for: "Optimized performance and cost"
          
        - id: "gpt-4o-mini"
          display: "GPT-4o Mini (Fast & Efficient)"
          input_cost_per_mtok: 0.00015        # $0.15 per million input tokens
          output_cost_per_mtok: 0.0006        # $0.60 per million output tokens
          max_tokens: 128000
          best_for: "Fast processing, cost-effective"
          
        - id: "gpt-3.5-turbo"
          display: "GPT-3.5 Turbo (Fast & Cheap)"
          input_cost_per_mtok: 0.0005         # $0.50 per million input tokens
          output_cost_per_mtok: 0.0015        # $1.50 per million output tokens
          max_tokens: 16000
          best_for: "Simple tasks, cost-effective"
  
  # Model selection per agent based on task complexity.
  # Real, current-generation Anthropic model IDs (format: claude-<tier>-<gen>):
  #   claude-opus-5, claude-opus-4-8, claude-sonnet-5, claude-sonnet-4-6, claude-haiku-4-5, claude-fable-5-1
  # Do NOT use claude-3-*, claude-3.5-*, or `claude-<gen>-<tier>` order — those are invalid IDs.
  models:
    agent1:
      name: "Discovery & Scoping Agent"
      # Discovery is largely signal-to-JSON formatting; Opus is overkill and
      # output-token generation on Opus (~30-50 tok/s) was dominating latency
      # (27-52s per LLM call). Sonnet 5 handles this well at ~2x speed.
      provider: "anthropic"
      model: "claude-sonnet-5"
      temperature: 0.7
      max_tokens: 2048
      task: "Scope analysis and architecture understanding"
      complexity: "HIGH"
      description: "Analyzes repository structure, identifies components, defines scope"

    agent2:
      name: "User Journey Mapping Agent"
      # LOW COMPLEXITY: Pattern matching on code structure — Haiku is enough.
      provider: "anthropic"
      model: "claude-haiku-4-5"
      temperature: 0.5
      max_tokens: 2048
      task: "Simple journey mapping from controller patterns"
      complexity: "LOW"
      description: "Maps user workflows through application endpoints"

    agent3:
      name: "Business Rules Extraction Agent"
      # LOW COMPLEXITY: Rule extraction with simple analysis.
      provider: "anthropic"
      model: "claude-haiku-4-5"
      temperature: 0.3
      max_tokens: 2048
      task: "Extract business rules from code patterns"
      complexity: "LOW"
      description: "Identifies business logic and validation rules from code"

    agent4:
      name: "Gap Analysis Agent"
      # LOW COMPLEXITY: Gap identification (checklist comparison).
      provider: "anthropic"
      model: "claude-haiku-4-5"
      temperature: 0.5
      max_tokens: 2048
      task: "Identify gaps by comparing code vs requirements"
      complexity: "LOW"
      description: "Compares current implementation against requirements"

    agent5:
      name: "Synthesis & Requirements Agent"
      # HIGH COMPLEXITY: Synthesize all data into coherent requirements.
      # Opus 5 earns its cost here; this is the reasoning-heavy stage.
      provider: "anthropic"
      model: "claude-opus-5"
      temperature: 0.7
      max_tokens: 4096
      task: "Complex synthesis of all BRD components"
      complexity: "HIGH"
      description: "Combines all agent outputs into unified requirement set"

    agent6:
      name: "Acceptance Criteria Agent"
      # LOW COMPLEXITY: Template-based acceptance criteria generation.
      provider: "anthropic"
      model: "claude-haiku-4-5"
      temperature: 0.3
      max_tokens: 1024
      task: "Fill templates for acceptance criteria (Given-When-Then)"
      complexity: "LOW"
      description: "Generates testable acceptance criteria from requirements"

    agent7:
      name: "Risk & Dependency Agent"
      # MEDIUM COMPLEXITY: Risk analysis requires strategic thinking.
      provider: "anthropic"
      model: "claude-sonnet-5"
      temperature: 0.6
      max_tokens: 3000
      task: "Analyze risks and identify dependencies"
      complexity: "MEDIUM"
      description: "Identifies technical risks and system dependencies"

    agent8:
      name: "BRD Summarizer & Output Agent"
      # HIGH COMPLEXITY: Write professional BRD document.
      # Opus 5 for the final synthesis — this is what users read.
      provider: "anthropic"
      model: "claude-opus-5"
      temperature: 0.7
      max_tokens: 8192
      task: "Complex document synthesis and writing"
      complexity: "HIGH"
      description: "Synthesizes final Business Requirements Document"

# Agent Configuration
agents:
  agent1:
    name: "Discovery & Scoping Agent"
    complexity: "HIGH"
    tools:
      - repo_scanner
      - doc_parser
      - jira_loader
      - confluence_loader
    enabled_tools:
      repo_scanner: true
      doc_parser: true
      jira_loader: false                     # Requires credentials
      confluence_loader: false               # Requires credentials
    output_files:
      - scope_definition.json
      - artifact_catalog.json
      - dependency_map.json

  agent2:
    name: "User Journey Mapping Agent"
    complexity: "LOW"
    tools:
      - code_analyzer
      - ontology_extractor
    enabled_tools:
      code_analyzer: true
      ontology_extractor: true
    output_files:
      - user_journeys.json
      - touchpoints.json

  agent3:
    name: "Business Rules Extraction Agent"
    complexity: "LOW"
    tools:
      - code_analyzer
    enabled_tools:
      code_analyzer: true
    output_files:
      - business_rules.json
      - validation_logic.json

  agent4:
    name: "Gap Analysis Agent"
    complexity: "LOW"
    tools:
      - vector_store
    enabled_tools:
      vector_store: true
    output_files:
      - gap_analysis.json
      - recommendations.json

  agent5:
    name: "Synthesis & Requirements Agent"
    complexity: "HIGH"
    tools: []
    output_files:
      - functional_requirements.json
      - non_functional_requirements.json

  agent6:
    name: "Acceptance Criteria Agent"
    complexity: "LOW"
    tools: []
    output_files:
      - acceptance_criteria.json
      - test_scenarios.json

  agent7:
    name: "Risk & Dependency Agent"
    complexity: "MEDIUM"
    tools:
      - code_analyzer
    enabled_tools:
      code_analyzer: true
    output_files:
      - risk_assessment.json
      - dependency_analysis.json

  agent8:
    name: "BRD Summarizer & Output Agent"
    complexity: "HIGH"
    tools: []
    output_files:
      - final_brd.md
      - executive_summary.json

  agent9:
    name: "KB Store Sync Agent"
    complexity: "NONE"
    tools:
      - vector_store
    enabled_tools:
      vector_store: true
    description: "Ingests KB/{repo_name}/ JSON artifacts into kb_store/ vector database"
    output_files:
      - ingestion_log.json
      - embedding_stats.json

# Tool Adapters
tool_adapters:
  repo_scanner: "tools.adapters.gitpython_adapter"
  doc_parser: "tools.adapters.unstructured_adapter"
  code_analyzer: "tools.adapters.semgrep_adapter"
  ontology_extractor: "tools.adapters.tree_sitter_adapter"
  vector_store: "tools.adapters.chromadb_adapter"
  jira_loader: "tools.adapters.stub_adapter"
  confluence_loader: "tools.adapters.stub_adapter"

# HITL Configuration
hitl:
  enabled: true
  triggers:
    - ambiguous_scope
    - low_confidence_artifact
    - conflicting_requirements
  review_timeout_hours: 48

# Vector Store Configuration (Agent 9)
vector_store:
  provider: "chromadb"
  embedding_model: "all-MiniLM-L6-v2"
  collection_name: "brd_artifacts"
  persistence_directory: "kb_store/chromadb"
  chunk_size: 500
  chunk_overlap: 50

# Logging
logging:
  level: "INFO"
  log_file: "orchestrator/event_log.json"
  enable_agent_traces: true
