[client]
toolbarMode = "viewer"
# "none" keeps Streamlit's own uncaught-exception tracebacks and deprecation
# warnings out of the browser; they still go to the console.
showErrorDetails = "none"
showErrorLinks = false

[runner]
magicEnabled = true

[logger]
level = "error"

[theme]
base = "dark"
primaryColor = "#f0883e"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"
font = "sans serif"
